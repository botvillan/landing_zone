="258" class="s" style="fill:#d4d4d8;font-size:17px">Project the last 4 days onto one clock</text><circle cx="668" cy="314" r="16" fill="#8ea2ff" fill-opacity="0.15" stroke="#8ea2ff"/><text x="668" y="319" text-anchor="middle" font-size="14" font-weight="700" fill="#8ea2ff">3</text><text x="698" y="320" class="s" style="fill:#d4d4d8;font-size:17px">Feeds within 45 min on 2+ days form a slot</text><circle cx="668" cy="376" r="16" fill="#8ea2ff" fill-opacity="0.15" stroke="#8ea2ff"/><text x="668" y="381" text-anchor="middle" font-size="14" font-weight="700" fill="#8ea2ff">4</text><text x="698" y="382" class="s" style="fill:#d4d4d8;font-size:17px">Slot time = their average</text><circle cx="668" cy="438" r="16" fill="#8ea2ff" fill-opacity="0.15" stroke="#8ea2ff"/><text x="668" y="443" text-anchor="middle" font-size="14" font-weight="700" fill="#8ea2ff">5</text><text x="698" y="444" class="s" style="fill:#d4d4d8;font-size:17px">Next Feed = the next upcoming slot</text><text x="650" y="520" class="n">no slot yet? last feed + median gap,</text><text x="650" y="542" class="n">or 24 h ÷ feeds per day</text><circle cx="660" cy="590" r="6" fill="#22d3ee"/><text x="676" y="595" class="n">a feed (one ring per day, newest outside)</text><circle cx="660" cy="616" r="6" fill="none" stroke="#f0abfc" stroke-width="2"/><text x="676" y="621" class="n">a one-off feed, ignored</text>
