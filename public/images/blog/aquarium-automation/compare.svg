<text x="60" y="64" class="m">SHOP-BOUGHT TIMER FEEDER VS FEEDBACK LOOP</text><text x="60" y="118" class="n">FEATURE</text><text x="560" y="118" class="n">TIMER FEEDER</text><text x="820" y="118" class="n" style="fill:#8ea2ff">FEEDBACK LOOP</text><rect x="800" y="90" width="350" height="514" rx="18" fill="#8ea2ff" fill-opacity="0.07" stroke="#8ea2ff" stroke-opacity="0.35"/><line x1="60" y1="130" x2="1150" y2="130" stroke="#ffffff" stroke-opacity="0.06"/><text x="60" y="166" class="s" style="fill:#e4e4e7;font-size:17px">Feeds on a schedule</text><circle cx="572" cy="160" r="12" fill="#4ade80" fill-opacity="0.15"/><path d="M-6,0 L-2,5 L7,-6" transform="translate(572,160)" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round"/><circle cx="832" cy="160" r="12" fill="#4ade80" fill-opacity="0.15"/><path d="M-6,0 L-2,5 L7,-6" transform="translate(832,160)" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round"/><text x="856" y="166" class="s" style="fill:#e4e4e7">Yes, from Home Assistant</text><line x1="60" y1="188" x2="1150" y2="188" stroke="#ffffff" stroke-opacity="0.06"/><text x="60" y="224" class="s" style="fill:#e4e4e7;font-size:17px">Knows how much food is left</text><circle cx="572" cy="218" r="12" fill="#f87171" fill-opacity="0.15"/><path d="M-5,-5 L5,5 M5,-5 L-5,5" transform="translate(572,218)" fill="none" stroke="#f87171" stroke-width="2.5" stroke-linecap="round"/><circle cx="832" cy="218" r="12" fill="#4ade80" fill-opacity="0.15"/><path d="M-6,0 L-2,5 L7,-6" transform="translate(832,218)" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round"/><text x="856" y="224" class="s" style="fill:#e4e4e7">Yes, to the percent</text><line x1="60" y1="246" x2="1150" y2="246" stroke="#ffffff" stroke-opacity="0.06"/><text x="60" y="282" class="s" style="fill:#e4e4e7;font-size:17px">Warns days before it runs out</text><circle cx="572" cy="276" r="12" fill="#f87171" fill-opacity="0.15"/><path d="M-5,-5 L5,5 M5,-5 L-5,5" transform="translate(572,276)" fill="none" stroke="#f87171" stroke-width="2.5" stroke-linecap="round"/><circle cx="832" cy="276" r="12" fill="#4ade80" fill-opacity="0.15"/><path d="M-6,0 L-2,5 L7,-6" transform="translate(832,276)" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round"/><text x="856" y="282" class="s" style="fill:#e4e4e7">Yes, forecast in days</text><line x1="60" y1="304" x2="1150" y2="304" stroke="#ffffff" stroke-opacity="0.06"/><text x="60" y="340" class="s" style="fill:#e4e4e7;font-size:17px">Notices a jammed feed</text><circle cx="572" cy="334" r="12" fill="#f87171" fill-opacity="0.15"/><path d="M-5,-5 L5,5 M5,-5 L-5,5" transform="translate(572,334)" fill="none" stroke="#f87171" stroke-width="2.5" stroke-linecap="round"/><circle cx="832" cy="334" r="12" fill="#4ade80" fill-opacity="0.15"/><path d="M-6,0 L-2,5 L7,-6" transform="translate(832,334)" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round"/><text x="856" y="340" class="s" style="fill:#e4e4e7">Yes, after 3 misses</text><line x1="60" y1="362" x2="1150" y2="362" stroke="#ffffff" stroke-opacity="0.06"/><text x="60" y="398" class="s" style="fill:#e4e4e7;font-size:17px">Learns my feeding times</text><circle cx="572" cy="392" r="12" fill="#f87171" fill-opacity="0.15"/><path d="M-5,-5 L5,5 M5,-5 L-5,5" transform="translate(572,392)" fill="none" stroke="#f87171" stroke-width="2.5" stroke-linecap="round"/><circle cx="832" cy="392" r="12" fill="#4ade80" fill-opacity="0.15"/><path d="M-6,0 L-2,5 L7,-6" transform="translate(832,392)" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round"/><text x="856" y="398" class="s" style="fill:#e4e4e7">Yes, from its own history</text><line x1="60" y1="420" x2="1150" y2="420" stroke="#ffffff" stroke-opacity="0.06"/><text x="60" y="456" class="s" style="fill:#e4e4e7;font-size:17px">Water temperature</text><circle cx="572" cy="450" r="12" fill="#f87171" fill-opacity="0.15"/><path d="M-5,-5 L5,5 M5,-5 L-5,5" transform="translate(572,450)" fill="none" stroke="#f87171" stroke-width="2.5" stroke-linecap="round"/><circle cx="832" cy="450" r="12" fill="#4ade80" fill-opacity="0.15"/><path d="M-6,0 L-2,5 L7,-6" transform="translate(832,450)" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round"/><text x="856" y="456" class="s" style="fill:#e4e4e7">Yes, every 10 seconds</text><line x1="60" y1="478" x2="1150" y2="478" stroke="#ffffff" stroke-opacity="0.06"/><text x="60" y="514" class="s" style="fill:#e4e4e7;font-size:17px">Feeds with Wi-Fi down</text><circle cx="572" cy="508" r="12" fill="#4ade80" fill-opacity="0.15"/><path d="M-6,0 L-2,5 L7,-6" transform="translate(572,508)" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round"/><circle cx="832" cy="508" r="12" fill="#f87171" fill-opacity="0.15"/><path d="M-5,-5 L5,5 M5,-5 L-5,5" transform="translate(832,508)" fill="none" stroke="#f87171" stroke-width="2.5" stroke-linecap="round"/><text x="856" y="514" class="s" style="fill:#e4e4e7">Not yet (on the list)</text><line x1="60" y1="536" x2="1150" y2="536" stroke="#ffffff" stroke-opacity="0.06"/><text x="60" y="572" class="s" style="fill:#e4e4e7;font-size:17px">Setup</text><text x="560" y="572" class="s">Batteries in</text><text x="820" y="572" class="s" style="fill:#e4e4e7">Soldering, YAML, calibration</text>
