<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif">
<defs>
<radialGradient id="glow" cx="0.2" cy="0.2" r="0.85"><stop offset="0" stop-color="#f0abfc" stop-opacity="0.13"/><stop offset="1" stop-color="#0b0b12" stop-opacity="0"/></radialGradient>
<linearGradient id="acc" x1="0" x2="1"><stop offset="0" stop-color="#8ea2ff"/><stop offset="1" stop-color="#c4b5fd"/></linearGradient>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1a1aa"/></marker>
<style>
.m{fill:#8ea2ff;font-size:13px;font-family:'Geist Mono', Consolas, ui-monospace, monospace;letter-spacing:1.5px}
.t{fill:#f4f4f5;font-size:20px;font-weight:600}
.t2{fill:#f4f4f5;font-size:17px;font-weight:600}
.s{fill:#a1a1aa;font-size:15px}
.n{fill:#a1a1aa;font-size:13px;font-family:'Geist Mono', Consolas, ui-monospace, monospace}
.big{fill:#f4f4f5;font-size:34px;font-weight:700;letter-spacing:-1px}
</style>
</defs>
<rect width="1200" height="600" fill="#0b0b12"/><rect width="1200" height="600" fill="url(#glow)"/>
<text x="60" y="64" class="m">ONE FEED, STEP BY STEP</text><rect x="60" y="100" width="330" height="150" rx="18" fill="#13131c" stroke="#4ade80" stroke-opacity="0.5" stroke-width="1.5"/><circle cx="100" cy="142" r="20" fill="#4ade80" fill-opacity="0.18" stroke="#4ade80"/><text x="100" y="149" text-anchor="middle" font-size="18" font-weight="700" fill="#4ade80">1</text><text x="134" y="149" class="t">Triggered</text><text x="86" y="194" class="s">Home Assistant presses</text><text x="86" y="218" class="s">Servo Feed Loop</text><path d="M394,175 H426" stroke="#71717a" stroke-width="2" marker-end="url(#arr)"/><rect x="430" y="100" width="330" height="150" rx="18" fill="#13131c" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1.5"/><circle cx="470" cy="142" r="20" fill="#fbbf24" fill-opacity="0.18" stroke="#fbbf24"/><text x="470" y="149" text-anchor="middle" font-size="18" font-weight="700" fill="#fbbf24">2</text><text x="504" y="149" class="t">Arm the jam check</text><text x="456" y="194" class="s">Note the level and the</text><text x="456" y="218" class="s">drop this feed should cause</text><path d="M764,175 H796" stroke="#71717a" stroke-width="2" marker-end="url(#arr)"/><rect x="800" y="100" width="330" height="150" rx="18" fill="#13131c" stroke="#f0abfc" stroke-opacity="0.5" stroke-width="1.5"/><circle cx="840" cy="142" r="20" fill="#f0abfc" fill-opacity="0.18" stroke="#f0abfc"/><text x="840" y="149" text-anchor="middle" font-size="18" font-weight="700" fill="#f0abfc">3</text><text x="874" y="149" class="t">Rock the hopper</text><text x="826" y="194" class="s">−100 ↔ −60, 400 ms each way,</text><text x="826" y="218" class="s">repeated Feed Loop Count times</text><rect x="60" y="290" width="330" height="150" rx="18" fill="#13131c" stroke="#c4b5fd" stroke-opacity="0.5" stroke-width="1.5"/><circle cx="100" cy="332" r="20" fill="#c4b5fd" fill-opacity="0.18" stroke="#c4b5fd"/><text x="100" y="339" text-anchor="middle" font-size="18" font-weight="700" fill="#c4b5fd">4</text><text x="134" y="339" class="t">Detach the servo</text><text x="86" y="384" class="s">No buzzing and no heat</text><text x="86" y="408" class="s">while it rests</text><path d="M394,365 H426" stroke="#71717a" stroke-width="2" marker-end="url(#arr)"/><rect x="430" y="290" width="330" height="150" rx="18" fill="#13131c" stroke="#22d3ee" stroke-opacity="0.5" stroke-width="1.5"/><circle cx="470" cy="332" r="20" fill="#22d3ee" fill-opacity="0.18" stroke="#22d3ee"/><text x="470" y="339" text-anchor="middle" font-size="18" font-weight="700" fill="#22d3ee">5</text><text x="504" y="339" class="t">Log the feed</text><text x="456" y="384" class="s">Time and cycle count,</text><text x="456" y="408" class="s">kept in flash</text><path d="M764,365 H796" stroke="#71717a" stroke-width="2" marker-end="url(#arr)"/><rect x="800" y="290" width="330" height="150" rx="18" fill="#13131c" stroke="#8ea2ff" stroke-opacity="0.5" stroke-width="1.5"/><circle cx="840" cy="332" r="20" fill="#8ea2ff" fill-opacity="0.18" stroke="#8ea2ff"/><text x="840" y="339" text-anchor="middle" font-size="18" font-weight="700" fill="#8ea2ff">6</text><text x="874" y="339" class="t">Refresh the forecast</text><text x="826" y="384" class="s">Feeds left, days left,</text><text x="826" y="408" class="s">next feed</text><path d="M1060,250 C1100,275 1100,275 1060,290 L240,290 C200,290 200,290 225,288" fill="none" stroke="#71717a" stroke-width="0"/><path d="M1135,250 V270 H225 V288" fill="none" stroke="#71717a" stroke-width="2" marker-end="url(#arr)"/><rect x="60" y="500" width="1070" height="76" rx="18" fill="#fbbf24" fill-opacity="0.07" stroke="#fbbf24" stroke-opacity="0.6" stroke-dasharray="7 6"/><text x="88" y="533" class="t2" style="fill:#fbbf24">12 minutes later</text><text x="88" y="559" class="s">Did the level drop by at least 40 % of what this feed should use? Three misses in a row → Feed Jam.</text><path d="M225,440 V496" stroke="#71717a" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arr)"/>
</svg>
