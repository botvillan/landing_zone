<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif">
<defs>
<radialGradient id="glow" cx="0.8" cy="0.15" r="0.85"><stop offset="0" stop-color="#8ea2ff" stop-opacity="0.13"/><stop offset="1" stop-color="#0b0b12" stop-opacity="0"/></radialGradient>
<linearGradient id="acc" x1="0" x2="1"><stop offset="0" stop-color="#8ea2ff"/><stop offset="1" stop-color="#c4b5fd"/></linearGradient>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1a1aa"/></marker>
<style>
.m{fill:#8ea2ff;font-size:13px;font-family:'Geist Mono', Consolas, ui-monospace, monospace;letter-spacing:1.5px}
.t{fill:#f4f4f5;font-size:20px;font-weight:600}
.t2{fill:#f4f4f5;font-size:17px;font-weight:600}
.s{fill:#a1a1aa;font-size:15px}
.n{fill:#a1a1aa;font-size:13px;font-family:'Geist Mono', Consolas, ui-monospace, monospace}
.big{fill:#f4f4f5;font-size:34px;font-weight:700;letter-spacing:-1px}
</style>
</defs>
<rect width="1200" height="630" fill="#0b0b12"/><rect width="1200" height="630" fill="url(#glow)"/>
<text x="60" y="64" class="m">HOW THE FEEDER IS WIRED</text><rect x="60" y="110" width="310" height="130" rx="16" fill="#13131c" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="1.5"/><rect x="60" y="128" width="4" height="94" rx="2" fill="#22d3ee"/><text x="84" y="146" class="t">VL53L0X</text><text x="84" y="170" class="s">Laser distance to the food</text><text x="84" y="196" class="n">I2C · SDA D2 · SCL D1</text><text x="84" y="216" class="n">address 0x29 · every 500 ms</text><rect x="60" y="300" width="310" height="130" rx="16" fill="#13131c" stroke="#fbbf24" stroke-opacity="0.55" stroke-width="1.5"/><rect x="60" y="318" width="4" height="94" rx="2" fill="#fbbf24"/><text x="84" y="336" class="t">DS18B20</text><text x="84" y="360" class="s">Water temperature probe</text><text x="84" y="386" class="n">1-Wire · D5 · pull-up on</text><text x="84" y="406" class="n">read every 10 s</text><rect x="450" y="150" width="300" height="240" rx="20" fill="#15152a" stroke="url(#acc)" stroke-width="2.5"/><text x="476" y="190" class="m">THE BRAIN</text><text x="476" y="224" class="t">NodeMCU V2</text><text x="476" y="250" class="s">ESP8266 running ESPHome</text><text x="476" y="290" class="n">· feed loop and servo moves</text><text x="476" y="312" class="n">· 5-minute health monitor</text><text x="476" y="334" class="n">· forecast and jam check</text><text x="476" y="356" class="n">· stats saved to flash</text><rect x="830" y="110" width="310" height="130" rx="16" fill="#13131c" stroke="#f0abfc" stroke-opacity="0.55" stroke-width="1.5"/><rect x="830" y="128" width="4" height="94" rx="2" fill="#f0abfc"/><text x="854" y="146" class="t">Hobby servo</text><text x="854" y="170" class="s">Rocks the hopper to feed</text><text x="854" y="196" class="n">PWM · D7 · 50 Hz</text><text x="854" y="216" class="n">0.5–2.5 ms pulse</text><rect x="830" y="300" width="310" height="130" rx="16" fill="#13131c" stroke="#4ade80" stroke-opacity="0.55" stroke-width="1.5"/><rect x="830" y="318" width="4" height="94" rx="2" fill="#4ade80"/><text x="854" y="336" class="t">Home Assistant</text><text x="854" y="360" class="s">Triggers feeds, keeps history</text><text x="854" y="386" class="n">Wi-Fi · encrypted API</text><text x="854" y="406" class="n">OTA firmware updates</text><rect x="830" y="490" width="310" height="100" rx="16" fill="#13131c" stroke="#8ea2ff" stroke-opacity="0.55" stroke-width="1.5"/><rect x="830" y="508" width="4" height="64" rx="2" fill="#8ea2ff"/><text x="854" y="526" class="t">My phone</text><text x="854" y="550" class="s">Dashboard and alerts</text><path d="M370,175 C410.0,175 410.0,230 450,230" fill="none" stroke="#22d3ee" stroke-width="2" stroke-opacity="0.8" marker-end="url(#arr)"/><path d="M370,365 C410.0,365 410.0,310 450,310" fill="none" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.8" marker-end="url(#arr)"/><path d="M750,230 C790.0,230 790.0,175 830,175" fill="none" stroke="#f0abfc" stroke-width="2" stroke-opacity="0.8" marker-end="url(#arr)"/><path d="M750,310 C790.0,310 790.0,365 830,365" fill="none" stroke="#4ade80" stroke-width="2" stroke-opacity="0.8" marker-end="url(#arr)" marker-start="url(#arr)"/><path d="M985,430 V488" stroke="#8ea2ff" stroke-width="2" marker-end="url(#arr)"/><text x="60" y="520" class="s">Two sensors in, one servo out.</text><text x="60" y="545" class="s">Everything else is decided in firmware.</text>
</svg>
