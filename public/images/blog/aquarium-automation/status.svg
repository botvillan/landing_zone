<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif">
<defs>
<radialGradient id="glow" cx="0.15" cy="0.2" r="0.85"><stop offset="0" stop-color="#f87171" stop-opacity="0.13"/><stop offset="1" stop-color="#0b0b12" stop-opacity="0"/></radialGradient>
<linearGradient id="acc" x1="0" x2="1"><stop offset="0" stop-color="#8ea2ff"/><stop offset="1" stop-color="#c4b5fd"/></linearGradient>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1a1aa"/></marker>
<style>
.m{fill:#8ea2ff;font-size:13px;font-family:'Geist Mono', Consolas, ui-monospace, monospace;letter-spacing:1.5px}
.t{fill:#f4f4f5;font-size:20px;font-weight:600}
.t2{fill:#f4f4f5;font-size:17px;font-weight:600}
.s{fill:#a1a1aa;font-size:15px}
.n{fill:#a1a1aa;font-size:13px;font-family:'Geist Mono', Consolas, ui-monospace, monospace}
.big{fill:#f4f4f5;font-size:34px;font-weight:700;letter-spacing:-1px}
</style>
</defs>
<rect width="1200" height="560" fill="#0b0b12"/><rect width="1200" height="560" fill="url(#glow)"/>
<text x="60" y="64" class="m">ONE STATUS, CHECKED EVERY 5 MINUTES</text><rect x="150" y="100" width="990" height="78" rx="18" fill="#f87171" fill-opacity="0.07" stroke="#f87171" stroke-opacity="0.55"/><rect x="172" y="120" width="170" height="38" rx="19" fill="#f87171" fill-opacity="0.2"/><circle cx="194" cy="139" r="6" fill="#f87171"/><text x="210" y="145" font-size="17" font-weight="700" fill="#f87171">Tank Empty</text><text x="370" y="145" class="s" style="fill:#d4d4d8;font-size:17px">Food level at or below 1 %</text><rect x="150" y="200" width="990" height="78" rx="18" fill="#fbbf24" fill-opacity="0.07" stroke="#fbbf24" stroke-opacity="0.55"/><rect x="172" y="220" width="170" height="38" rx="19" fill="#fbbf24" fill-opacity="0.2"/><circle cx="194" cy="239" r="6" fill="#fbbf24"/><text x="210" y="245" font-size="17" font-weight="700" fill="#fbbf24">Feed Jam</text><text x="370" y="245" class="s" style="fill:#d4d4d8;font-size:17px">3 feeds in a row used less than 40 % of the expected food</text><rect x="150" y="300" width="990" height="78" rx="18" fill="#c4b5fd" fill-opacity="0.07" stroke="#c4b5fd" stroke-opacity="0.55"/><rect x="172" y="320" width="170" height="38" rx="19" fill="#c4b5fd" fill-opacity="0.2"/><circle cx="194" cy="339" r="6" fill="#c4b5fd"/><text x="210" y="345" font-size="17" font-weight="700" fill="#c4b5fd">Anomaly</text><text x="370" y="345" class="s" style="fill:#d4d4d8;font-size:17px">No drop at all for 24 hours</text><rect x="150" y="400" width="990" height="78" rx="18" fill="#4ade80" fill-opacity="0.07" stroke="#4ade80" stroke-opacity="0.55"/><rect x="172" y="420" width="170" height="38" rx="19" fill="#4ade80" fill-opacity="0.2"/><circle cx="194" cy="439" r="6" fill="#4ade80"/><text x="210" y="445" font-size="17" font-weight="700" fill="#4ade80">All Good</text><text x="370" y="445" class="s" style="fill:#d4d4d8;font-size:17px">None of the above</text><path d="M95,110 V470" stroke="#71717a" stroke-width="2" marker-end="url(#arr)"/><text x="80" y="290" class="n" transform="rotate(-90 80 290)" text-anchor="middle">first match wins</text><text x="150" y="530" class="s">One good feed, or a refill, clears Feed Jam.</text>
</svg>
