<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <radialGradient id="glow" cx="0.8" cy="0.2" r="0.8"><stop offset="0" stop-color="#c4b5fd" stop-opacity="0.12"/><stop offset="1" stop-color="#0b0b12" stop-opacity="0"/></radialGradient>
    <linearGradient id="acc" x1="0" x2="1"><stop offset="0" stop-color="#8ea2ff"/><stop offset="1" stop-color="#c4b5fd"/></linearGradient>
    <style>
      .m { fill: #8ea2ff; font-size: 13px; font-family: 'Geist Mono', Consolas, ui-monospace, monospace; letter-spacing: 1.5px; }
      .big { fill: #f4f4f5; font-size: 64px; font-weight: 650; letter-spacing: -2px; }
      .t { fill: #f4f4f5; font-size: 18px; font-weight: 600; }
      .s { fill: #a1a1aa; font-size: 15px; }
      .n { fill: #a1a1aa; font-size: 14px; font-family: 'Geist Mono', Consolas, ui-monospace, monospace; }
    </style>
  </defs>
  <rect width="1200" height="600" fill="#0b0b12"/>
  <rect width="1200" height="600" fill="url(#glow)"/>

  <text x="60" y="64" class="m">WHAT THIS SESSION COST, MEASURED JUST BEFORE WRITING</text>

  <text x="60" y="150" class="big">~276k</text>
  <text x="62" y="182" class="s">tokens in the conversation context (of a 1M window)</text>

  <!-- Stacked bar: 275,642 total mapped to 1080px -->
  <g transform="translate(60 220)">
    <rect width="1080" height="44" rx="12" fill="#18181f"/>
    <rect x="0" width="786" height="44" rx="12" fill="url(#acc)"/>
    <rect x="780" width="146" height="44" fill="#22d3ee"/>
    <rect x="926" width="80" height="44" fill="#4ade80"/>
    <rect x="1006" width="42" height="44" fill="#fbbf24"/>
    <rect x="1048" width="32" height="44" rx="0" fill="#f0abfc"/>
    <rect width="1080" height="44" rx="12" fill="none" stroke="#fff" stroke-opacity="0.1"/>
  </g>
  <g transform="translate(60 300)">
    <rect width="14" height="14" rx="4" fill="url(#acc)"/><text x="24" y="12" class="t">Conversation</text><text x="24" y="36" class="n">200.7k · code, files, tool output</text>
    <rect x="390" width="14" height="14" rx="4" fill="#22d3ee"/><text x="414" y="12" class="t">Built-in tools</text><text x="414" y="36" class="n">37.3k</text>
    <rect x="620" width="14" height="14" rx="4" fill="#4ade80"/><text x="644" y="12" class="t">Connector tools</text><text x="644" y="36" class="n">20.5k</text>
    <rect x="860" width="14" height="14" rx="4" fill="#fbbf24"/><text x="884" y="12" class="t">System prompt</text><text x="884" y="36" class="n">10.6k</text>
    <rect x="860" y="56" width="14" height="14" rx="4" fill="#f0abfc"/><text x="884" y="68" class="t">Skills + other</text><text x="884" y="92" class="n">6.5k</text>
  </g>

  <!-- Plan meters -->
  <g transform="translate(60 440)">
    <text x="0" y="0" class="t">Claude Pro, 5-hour limit</text>
    <rect y="18" width="480" height="14" rx="7" fill="#18181f"/>
    <rect y="18" width="125" height="14" rx="7" fill="url(#acc)"/>
    <text x="0" y="62" class="n">26% used</text>
  </g>
  <g transform="translate(620 440)">
    <text x="0" y="0" class="t">Claude Pro, weekly limit</text>
    <rect y="18" width="480" height="14" rx="7" fill="#18181f"/>
    <rect y="18" width="125" height="14" rx="7" fill="url(#acc)"/>
    <text x="0" y="62" class="n">26% used (whole account)</text>
  </g>
  <text x="60" y="560" class="s">No extra usage, no API bill. Hosting, build minutes and HTTPS are free on GitHub.</text>
</svg>
