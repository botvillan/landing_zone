18" fill="#13131c" stroke="#4ade80" stroke-opacity="0.5" stroke-width="1.5"/><rect x="870" y="110" width="250" height="130" rx="18" fill="#4ade80" fill-opacity="0.12" stroke="#4ade80" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.429;0.449;0.551;0.571;1" dur="7.0s" repeatCount="indefinite"/></rect><text x="894" y="152" class="t2" text-anchor="start" >record last run</text><text x="894" y="188" class="s" text-anchor="start" >exit code + output</text><text x="894" y="212" class="s" text-anchor="start" >to flow context</text><path d="M312,175 H328" stroke="#71717a" stroke-width="2" fill="none" marker-end="url(#arr)"/><path d="M582,175 H598" stroke="#71717a" stroke-width="2" fill="none" marker-end="url(#arr)"/><path d="M852,175 H868" stroke="#71717a" stroke-width="2" fill="none" marker-end="url(#arr)"/><rect x="330" y="300" width="810" height="250" rx="22" fill="none" stroke="#3f3f46" stroke-dasharray="6 6"/><text x="354" y="330" class="m" text-anchor="start" >ON PLUTO</text><path d="M725,240 V296" stroke="#71717a" stroke-width="2" fill="none" marker-end="url(#arr)"/><rect x="360" y="350" width="230" height="120" rx="18" fill="#13131c" stroke="#22d3ee" stroke-opacity="0.5" stroke-width="1.5"/><rect x="360" y="350" width="230" height="120" rx="18" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.429;0.449;0.551;0.571;1" dur="7.0s" repeatCount="indefinite"/></rect><text x="382" y="390" class="t2" text-anchor="start" >Epic store API</text><text x="382" y="424" class="s" text-anchor="start" >freeGamesPromotions</text><text x="382" y="446" class="s" text-anchor="start" >price 0 + promo active</text><rect x="620" y="350" width="230" height="120" rx="18" fill="#13131c" stroke="#f0abfc" stroke-opacity="0.5" stroke-width="1.5"/><rect x="620" y="350" width="230" height="120" rx="18" fill="#f0abfc" fill-opacity="0.12" stroke="#f0abfc" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.571;0.591;0.694;0.714;1" dur="7.0s" repeatCount="indefinite"/></rect><text x="642" y="390" class="t2" text-anchor="start" >Steam search</text><text x="642" y="424" class="s" text-anchor="start" >Metacritic score,</text><text x="642" y="446" class="s" text-anchor="start" >no API key needed</text><rect x="880" y="350" width="230" height="120" rx="18" fill="#13131c" stroke="#4ade80" stroke-opacity="0.5" stroke-width="1.5"/><rect x="880" y="350" width="230" height="120" rx="18" fill="#4ade80" fill-opacity="0.12" stroke="#4ade80" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.714;0.734;0.837;0.857;1" dur="7.0s" repeatCount="indefinite"/></rect><text x="902" y="390" class="t2" text-anchor="start" >ntfy</text><text x="902" y="424" class="s" text-anchor="start" >Title, price, rating,</text><text x="902" y="446" class="s" text-anchor="start" >end date, cover image</text><path d="M592,410 H616" stroke="#71717a" stroke-width="2" fill="none" marker-end="url(#arr)"/><path d="M852,410 H876" stroke="#71717a" stroke-width="2" fill="none" marker-end="url(#arr)"/><text x="360" y="520" class="s" text-anchor="start" >sent_games.json remembers what was already announced: no repeats.</text><rect x="80" y="300" width="200" height="250" rx="26" fill="#13131c" stroke="#4ade80" stroke-opacity="0.5"/><rect x="80" y="300" width="200" height="250" rx="26" fill="#4ade80" fill-opacity="0.12" stroke="#4ade80" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.857;0.877;0.979;0.999;1" dur="7.0s" repeatCount="indefinite"/></rect><rect x="96" y="340" width="168" height="74" rx="12" fill="#1c1c27"/><text x="108" y="364" class="n" text-anchor="start" >Free on Epic:</text><text x="108" y="386" class="t2" text-anchor="start" >Knightica</text><text x="108" y="404" class="n" text-anchor="start" font-size="11">ends Thu 19 Nov</text><text x="180" y="470" class="s" text-anchor="middle" >my phone</text><path d="M876,470 C700,600 300,600 282,470" stroke="#71717a" stroke-width="2" fill="none" stroke-dasharray="6 6" marker-end="url(#arr)"/><circle r="6" fill="#f0abfc"><animateMotion path="M185,175 H995" dur="7.0s" begin="0.0s" repeatCount="indefinite" rotate="auto"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.9;1" dur="7.0s" begin="0.0s" repeatCount="indefinite"/></circle>
