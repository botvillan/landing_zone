d8" stroke="#52525b"/><circle cx="948" cy="376" r="5" fill="#4ade80"/><text x="960" y="381" font-size="12" fill="#a1a1aa">ok 13/11/2026, 18:00:04</text><circle r="5" fill="#f4f4f5"><animateMotion path="M285,190 C370,190 370,270 455,270 L625,270 L715,270 L865,270 C900,270 900,340 935,340" dur="4.0s" begin="0.0s" repeatCount="indefinite" rotate="auto"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.9;1" dur="4.0s" begin="0.0s" repeatCount="indefinite"/></circle><text x="80" y="470" class="s" text-anchor="start" >Three triggers, one command. The SSH node puts the script's output in msg.session,</text><text x="80" y="496" class="s" text-anchor="start" >not msg.payload, which is the one thing that tripped me up.</text>
