<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" width="1200" height="550" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif"><defs><radialGradient id="glow" cx="0.2" cy="0.2" r="0.85"><stop offset="0" stop-color="#f0abfc" stop-opacity="0.12"/><stop offset="1" stop-color="#0b0b12" stop-opacity="0"/></radialGradient><radialGradient id="glow2" cx="0.85" cy="0.9" r="0.7"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.08"/><stop offset="1" stop-color="#0b0b12" stop-opacity="0"/></radialGradient><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1a1aa"/></marker><style>.m{fill:#8ea2ff;font-size:13px;font-family:'Geist Mono', Consolas, ui-monospace, monospace;letter-spacing:1.5px}.t2{fill:#f4f4f5;font-size:17px;font-weight:600}.s{fill:#a1a1aa;font-size:14px}.n{fill:#a1a1aa;font-size:12px;font-family:'Geist Mono', Consolas, ui-monospace, monospace}.c{fill:#e4e4e7;font-size:14px;font-family:'Geist Mono', Consolas, ui-monospace, monospace}.f{fill:none;stroke-width:3;stroke-linecap:round;stroke-dasharray:2 18;animation:fl 1.1s linear infinite}@keyframes fl{to{stroke-dashoffset:-20}}@keyframes r0{0%,4%{opacity:0;transform:translateX(-14px)}8%,92%{opacity:1;transform:translateX(0)}100%{opacity:0}}.r0{animation:r0 12.0s ease-out infinite}@keyframes h0{0%,4%{opacity:0}8%,20%{opacity:1}24%,100%{opacity:0}}.h0{animation:h0 12.0s ease-out infinite;opacity:0}@keyframes r1{0%,18%{opacity:0;transform:translateX(-14px)}22%,92%{opacity:1;transform:translateX(0)}100%{opacity:0}}.r1{animation:r1 12.0s ease-out infinite}@keyframes h1{0%,18%{opacity:0}22%,34%{opacity:1}38%,100%{opacity:0}}.h1{animation:h1 12.0s ease-out infinite;opacity:0}@keyframes r2{0%,32%{opacity:0;transform:translateX(-14px)}36%,92%{opacity:1;transform:translateX(0)}100%{opacity:0}}.r2{animation:r2 12.0s ease-out infinite}@keyframes h2{0%,32%{opacity:0}36%,48%{opacity:1}52%,100%{opacity:0}}.h2{animation:h2 12.0s ease-out infinite;opacity:0}@keyframes r3{0%,46%{opacity:0;transform:translateX(-14px)}50%,92%{opacity:1;transform:translateX(0)}100%{opacity:0}}.r3{animation:r3 12.0s ease-out infinite}@keyframes h3{0%,46%{opacity:0}50%,62%{opacity:1}66%,100%{opacity:0}}.h3{animation:h3 12.0s ease-out infinite;opacity:0}@keyframes r4{0%,60%{opacity:0;transform:translateX(-14px)}64%,92%{opacity:1;transform:translateX(0)}100%{opacity:0}}.r4{animation:r4 12.0s ease-out infinite}@keyframes h4{0%,60%{opacity:0}64%,76%{opacity:1}80%,100%{opacity:0}}.h4{animation:h4 12.0s ease-out infinite;opacity:0}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style></defs><rect width="1200" height="550" fill="#0b0b12"/><rect width="1200" height="550" fill="url(#glow)"/><rect width="1200" height="550" fill="url(#glow2)"/><text x="40" y="50" class="m" text-anchor="start" >ONE FLOW RECORD, ENRICHED STEP BY STEP</text><rect x="40" y="100" width="400" height="60" rx="12" fill="#13131c" stroke="#3f3f46"/><rect class="h0" x="40" y="100" width="400" height="60" rx="12" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-width="2"/><circle cx="74" cy="130" r="16" fill="#22d3ee" fill-opacity="0.18" stroke="#22d3ee"/><text x="74" y="136" text-anchor="middle" font-size="16" font-weight="700" fill="#22d3ee">1</text><text x="104" y="136" class="t2" text-anchor="start" style="font-size:16px">NetFlow record arrives</text><rect x="40" y="178" width="400" height="60" rx="12" fill="#13131c" stroke="#3f3f46"/><rect class="h1" x="40" y="178" width="400" height="60" rx="12" fill="#4ade80" fill-opacity="0.12" stroke="#4ade80" stroke-width="2"/><circle cx="74" cy="208" r="16" fill="#4ade80" fill-opacity="0.18" stroke="#4ade80"/><text x="74" y="214" text-anchor="middle" font-size="16" font-weight="700" fill="#4ade80">2</text><text x="104" y="214" class="t2" text-anchor="start" style="font-size:16px">GeoIP lookup (DB-IP Lite)</text><rect x="40" y="256" width="400" height="60" rx="12" fill="#13131c" stroke="#3f3f46"/><rect class="h2" x="40" y="256" width="400" height="60" rx="12" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-width="2"/><circle cx="74" cy="286" r="16" fill="#fbbf24" fill-opacity="0.18" stroke="#fbbf24"/><text x="74" y="292" text-anchor="middle" font-size="16" font-weight="700" fill="#fbbf24">3</text><text x="104" y="292" class="t2" text-anchor="start" style="font-size:16px">ASN lookup</text><rect x="40" y="334" width="400" height="60" rx="12" fill="#13131c" stroke="#3f3f46"/><rect class="h3" x="40" y="334" width="400" height="60" rx="12" fill="#f0abfc" fill-opacity="0.12" stroke="#f0abfc" stroke-width="2"/><circle cx="74" cy="364" r="16" fill="#f0abfc" fill-opacity="0.18" stroke="#f0abfc"/><text x="74" y="370" text-anchor="middle" font-size="16" font-weight="700" fill="#f0abfc">4</text><text x="104" y="370" class="t2" text-anchor="start" style="font-size:16px">ASN → app label</text><rect x="40" y="412" width="400" height="60" rx="12" fill="#13131c" stroke="#3f3f46"/><rect class="h4" x="40" y="412" width="400" height="60" rx="12" fill="#8ea2ff" fill-opacity="0.12" stroke="#8ea2ff" stroke-width="2"/><circle cx="74" cy="442" r="16" fill="#8ea2ff" fill-opacity="0.18" stroke="#8ea2ff"/><text x="74" y="448" text-anchor="middle" font-size="16" font-weight="700" fill="#8ea2ff">5</text><text x="104" y="448" class="t2" text-anchor="start" style="font-size:16px">Name exporter joins host</text><path d="M450,270 H510" stroke="#52525b" stroke-width="2" fill="none" marker-end="url(#arr)"/><path d="M450,270 H510" stroke="#22d3ee" class="f"/><rect x="520" y="100" width="640" height="372" rx="16" fill="#101018" stroke="#3f3f46"/><text x="548" y="136" class="n" text-anchor="start" >flow log line in Loki</text><line x1="548" y1="150" x2="1132" y2="150" stroke="#27272a"/><g class="r0"><rect x="548" y="168" width="584" height="44" rx="8" fill="#22d3ee" fill-opacity="0.07"/><text x="566" y="196" class="c" style="fill:#22d3ee">bytes</text><text x="690" y="196" class="c">24.6 MB  ·  dst port 443/tcp</text></g><g class="r1"><rect x="548" y="226" width="584" height="44" rx="8" fill="#4ade80" fill-opacity="0.07"/><text x="566" y="254" class="c" style="fill:#4ade80">country</text><text x="690" y="254" class="c">US</text></g><g class="r2"><rect x="548" y="284" width="584" height="44" rx="8" fill="#fbbf24" fill-opacity="0.07"/><text x="566" y="312" class="c" style="fill:#fbbf24">asn</text><text x="690" y="312" class="c">AS15169  Google LLC</text></g><g class="r3"><rect x="548" y="342" width="584" height="44" rx="8" fill="#f0abfc" fill-opacity="0.07"/><text x="566" y="370" class="c" style="fill:#f0abfc">app</text><text x="690" y="370" class="c">YouTube / Google</text></g><g class="r4"><rect x="548" y="400" width="584" height="44" rx="8" fill="#8ea2ff" fill-opacity="0.07"/><text x="566" y="428" class="c" style="fill:#8ea2ff">host</text><text x="690" y="428" class="c">Laptop</text></g><text x="40" y="520" class="s" text-anchor="start" >Grafana then sums bytes by app, by host, or by country. No packet inspection, just lookups.</text></svg>