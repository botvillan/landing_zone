<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif"><defs><radialGradient id="glow" cx="0.2" cy="0.2" r="0.85"><stop offset="0" stop-color="#f0abfc" stop-opacity="0.12"/><stop offset="1" stop-color="#0b0b12" stop-opacity="0"/></radialGradient><radialGradient id="glow2" cx="0.85" cy="0.9" r="0.7"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.08"/><stop offset="1" stop-color="#0b0b12" stop-opacity="0"/></radialGradient><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1a1aa"/></marker><style>.m{fill:#8ea2ff;font-size:13px;font-family:'Geist Mono', Consolas, ui-monospace, monospace;letter-spacing:1.5px}.t2{fill:#f4f4f5;font-size:17px;font-weight:600}.s{fill:#a1a1aa;font-size:14px}.n{fill:#a1a1aa;font-size:12px;font-family:'Geist Mono', Consolas, ui-monospace, monospace}.c{fill:#e4e4e7;font-size:14px;font-family:'Geist Mono', Consolas, ui-monospace, monospace}.f{fill:none;stroke-width:3;stroke-linecap:round;stroke-dasharray:2 18;animation:fl 1.1s linear infinite}@keyframes fl{to{stroke-dashoffset:-20}}@keyframes h0{0%,0%{opacity:0}3%,20%{opacity:1}23%,100%{opacity:0}}.h0{animation:h0 8.0s linear infinite;opacity:0}@keyframes h1{0%,22%{opacity:0}25%,42%{opacity:1}45%,100%{opacity:0}}.h1{animation:h1 8.0s linear infinite;opacity:0}@keyframes h2{0%,44%{opacity:0}47%,64%{opacity:1}67%,100%{opacity:0}}.h2{animation:h2 8.0s linear infinite;opacity:0}@keyframes h3{0%,66%{opacity:0}69%,86%{opacity:1}89%,100%{opacity:0}}.h3{animation:h3 8.0s linear infinite;opacity:0}.log{animation:lg 2.2s linear infinite}@keyframes lg{0%{opacity:.25}50%{opacity:1}100%{opacity:.25}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style></defs><rect width="1200" height="460" fill="#0b0b12"/><rect width="1200" height="460" fill="url(#glow)"/><rect width="1200" height="460" fill="url(#glow2)"/><text x="40" y="50" class="m" text-anchor="start" >FROM A LOG LINE TO MY POCKET</text><rect x="40" y="90" width="255" height="300" rx="16" fill="#13131c" stroke="#f97316" stroke-opacity="0.45" stroke-width="1.5"/><rect class="h0" x="40" y="90" width="255" height="300" rx="16" fill="#f97316" fill-opacity="0.10" stroke="#f97316" stroke-width="3"/><text x="62" y="124" class="t2" text-anchor="start" style="fill:#f97316">1  Detect</text><text x="62" y="152" class="s" text-anchor="start" >pfSense logs every</text><text x="62" y="172" class="s" text-anchor="start" >blocked packet</text><path d="M297,240 H321" stroke="#52525b" stroke-width="2" fill="none" marker-end="url(#arr)"/><rect x="325" y="90" width="255" height="300" rx="16" fill="#13131c" stroke="#fbbf24" stroke-opacity="0.45" stroke-width="1.5"/><rect class="h1" x="325" y="90" width="255" height="300" rx="16" fill="#fbbf24" fill-opacity="0.10" stroke="#fbbf24" stroke-width="3"/><text x="347" y="124" class="t2" text-anchor="start" style="fill:#fbbf24">2  Rule</text><text x="347" y="152" class="s" text-anchor="start" >LogQL: blocks from one</text><text x="347" y="172" class="s" text-anchor="start" >source, many ports, 5 min</text><path d="M582,240 H606" stroke="#52525b" stroke-width="2" fill="none" marker-end="url(#arr)"/><rect x="610" y="90" width="255" height="300" rx="16" fill="#13131c" stroke="#f87171" stroke-opacity="0.45" stroke-width="1.5"/><rect class="h2" x="610" y="90" width="255" height="300" rx="16" fill="#f87171" fill-opacity="0.10" stroke="#f87171" stroke-width="3"/><text x="632" y="124" class="t2" text-anchor="start" style="fill:#f87171">3  Fire</text><text x="632" y="152" class="s" text-anchor="start" >pending for 2 min,</text><text x="632" y="172" class="s" text-anchor="start" >then firing</text><path d="M867,240 H891" stroke="#52525b" stroke-width="2" fill="none" marker-end="url(#arr)"/><rect x="895" y="90" width="255" height="300" rx="16" fill="#13131c" stroke="#4ade80" stroke-opacity="0.45" stroke-width="1.5"/><rect class="h3" x="895" y="90" width="255" height="300" rx="16" fill="#4ade80" fill-opacity="0.10" stroke="#4ade80" stroke-width="3"/><text x="917" y="124" class="t2" text-anchor="start" style="fill:#4ade80">4  Notify</text><text x="917" y="152" class="s" text-anchor="start" >ntfy push with</text><text x="917" y="172" class="s" text-anchor="start" >summary + link</text><text x="62" y="215" class="n log" style="animation-delay:0.0s;fill:#fdba74">block  in  tcp 22</text><text x="62" y="239" class="n log" style="animation-delay:0.3s;fill:#fdba74">block  in  tcp 23</text><text x="62" y="263" class="n log" style="animation-delay:0.6s;fill:#fdba74">block  in  tcp 80</text><text x="62" y="287" class="n log" style="animation-delay:0.8999999999999999s;fill:#fdba74">block  in  tcp 445</text><text x="62" y="311" class="n log" style="animation-delay:1.2s;fill:#fdba74">block  in  tcp 3389</text><text x="62" y="335" class="n log" style="animation-delay:1.5s;fill:#fdba74">block  in  tcp 8080</text><line x1="345" y1="270" x2="560" y2="270" stroke="#fbbf24" stroke-dasharray="5 5"/><text x="560" y="262" class="n" text-anchor="end" >threshold</text><polyline fill="none" stroke="#e4e4e7" stroke-width="2.5" points="345,350 370,345 395,348 420,340 445,342 470,300 495,250 520,235 545,245 560,260"/><rect x="632" y="214" width="150" height="34" rx="17" fill="#71717a" fill-opacity="0.15" stroke="#71717a"/><text x="707" y="236" class="c" text-anchor="middle" style="fill:#71717a">normal</text><rect x="632" y="264" width="150" height="34" rx="17" fill="#fbbf24" fill-opacity="0.15" stroke="#fbbf24"/><text x="707" y="286" class="c" text-anchor="middle" style="fill:#fbbf24">pending</text><rect x="632" y="314" width="150" height="34" rx="17" fill="#f87171" fill-opacity="0.15" stroke="#f87171"/><text x="707" y="336" class="c" text-anchor="middle" style="fill:#f87171">firing</text><rect x="913" y="214" width="219" height="120" rx="14" fill="#27272a" stroke="#4ade80" stroke-opacity="0.6"/><text x="929" y="240" class="n" text-anchor="start" >ntfy · just now</text><text x="929" y="266" class="t2" text-anchor="start" style="font-size:15px">[FIRING] Port scan</text><text x="929" y="288" class="s" text-anchor="start" style="font-size:13px">one source hit 40 ports</text><text x="929" y="308" class="s" text-anchor="start" style="font-size:13px">in 5 minutes</text><text x="40" y="430" class="s" text-anchor="start" >The same alert also drops a red marker on the dashboard, so I can see when it started.</text></svg>