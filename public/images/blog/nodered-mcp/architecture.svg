opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.520;0.730;0.750;1" dur="6.0s" repeatCount="indefinite"/></rect><circle cx="660" cy="152" r="20" fill="#fbbf24" fill-opacity="0.18" stroke="#fbbf24"/><text x="660" y="159" text-anchor="middle" font-size="18" font-weight="700" fill="#fbbf24">3</text><text x="692" y="159" class="t2" text-anchor="start" >Add-on nginx :1880</text><text x="646" y="210" class="s" text-anchor="start" >Checks a Home</text><text x="646" y="234" class="s" text-anchor="start" >Assistant login</text><rect x="900" y="110" width="240" height="170" rx="18" fill="#13131c" stroke="#4ade80" stroke-opacity="0.5" stroke-width="1.5"/><rect x="900" y="110" width="240" height="170" rx="18" fill="#4ade80" fill-opacity="0.12" stroke="#4ade80" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.750;0.770;0.980;1.000;1" dur="6.0s" repeatCount="indefinite"/></rect><circle cx="940" cy="152" r="20" fill="#4ade80" fill-opacity="0.18" stroke="#4ade80"/><text x="940" y="159" text-anchor="middle" font-size="18" font-weight="700" fill="#4ade80">4</text><text x="972" y="159" class="t2" text-anchor="start" >Node-RED</text><text x="926" y="210" class="s" text-anchor="start" >Admin HTTP API</text><text x="926" y="234" class="s" text-anchor="start" >/flows  /flow/:id</text><path d="M302,195 H336" stroke="#71717a" stroke-width="2" fill="none" marker-end="url(#arr)"/><text x="320" y="312" class="n" text-anchor="middle" >stdio (MCP)</text><path d="M582,195 H616" stroke="#71717a" stroke-width="2" fill="none" marker-end="url(#arr)"/><text x="600" y="312" class="n" text-anchor="middle" >HTTP Basic auth</text><path d="M862,195 H896" stroke="#71717a" stroke-width="2" fill="none" marker-end="url(#arr)"/><text x="880" y="312" class="n" text-anchor="middle" >proxy</text><circle r="6" fill="#f0abfc"><animateMotion path="M180,195 H1020" dur="6.0s" begin="0.0s" repeatCount="indefinite" rotate="auto"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.9;1" dur="6.0s" begin="0.0s" repeatCount="indefinite"/></circle><path d="M460,280 V380" stroke="#71717a" stroke-width="2" fill="none" stroke-dasharray="6 6" marker-end="url(#arr)"/><rect x="340" y="384" width="240" height="130" rx="18" fill="#13131c" stroke="#f0abfc" stroke-opacity="0.5" stroke-width="1.5"/><text x="366" y="424" class="t2" text-anchor="start" >backups/</text><text x="366" y="456" class="s" text-anchor="start" >Full copy of every flow,</text><text x="366" y="480" class="s" text-anchor="start" >written before each change</text><rect x="620" y="384" width="520" height="130" rx="18" fill="#13131c" stroke="#22d3ee" stroke-opacity="0.5" stroke-width="1.5"/><text x="646" y="424" class="t2" text-anchor="start" >What Claude gets: 15 tools</text><text x="646" y="456" class="s" text-anchor="start" >Read flows, search nodes, create / edit / delete tabs,</text><text x="646" y="480" class="s" text-anchor="start" >press inject buttons, list and restore backups.</text><text x="60" y="570" class="s" text-anchor="start" >Passwords stay in a git-ignored .env next to server.py, never in chat or Claude's config.</text>
