acity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.520;0.730;0.750;1" dur="8.0s" repeatCount="indefinite"/></rect><circle cx="684" cy="384" r="20" fill="#8ea2ff" fill-opacity="0.18" stroke="#8ea2ff"/><text x="684" y="391" text-anchor="middle" font-size="18" font-weight="700" fill="#8ea2ff">3</text><text x="720" y="391" class="t" text-anchor="start" >Export to git</text><text x="670" y="440" class="s" text-anchor="start" >tools/export.py splits flows</text><text x="670" y="466" class="s" text-anchor="start" >per tab + function code</text><rect x="60" y="340" width="500" height="170" rx="18" fill="#13131c" stroke="#4ade80" stroke-opacity="0.5" stroke-width="1.5"/><rect x="60" y="340" width="500" height="170" rx="18" fill="#4ade80" fill-opacity="0.12" stroke="#4ade80" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.750;0.770;0.980;1.000;1" dur="8.0s" repeatCount="indefinite"/></rect><circle cx="104" cy="384" r="20" fill="#4ade80" fill-opacity="0.18" stroke="#4ade80"/><text x="104" y="391" text-anchor="middle" font-size="18" font-weight="700" fill="#4ade80">4</text><text x="140" y="391" class="t" text-anchor="start" >Review and push</text><text x="90" y="440" class="s" text-anchor="start" >git diff shows exactly</text><text x="90" y="466" class="s" text-anchor="start" >what moved, then commit</text><path d="M564,195 H636" stroke="#71717a" stroke-width="2" fill="none" marker-end="url(#arr)"/><path d="M890,284 V336" stroke="#71717a" stroke-width="2" fill="none" marker-end="url(#arr)"/><path d="M636,425 H564" stroke="#71717a" stroke-width="2" fill="none" marker-end="url(#arr)"/><path d="M310,336 V284" stroke="#71717a" stroke-width="2" fill="none" stroke-dasharray="6 6" marker-end="url(#arr)"/><text x="330" y="316" class="n" text-anchor="start" >broke it? restore_backup</text>
